name: League Mission Decoder CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'starter-files/Python/part-04/league-mission-decoder/**'
      - '.github/workflows/league-mission-decoder.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'starter-files/Python/part-04/league-mission-decoder/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/league-mission-decoder

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black

      - name: Lint with flake8
        run: |
          cd starter-files/Python/part-04/league-mission-decoder
          # Stop build on syntax errors and undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: |
          cd starter-files/Python/part-04/league-mission-decoder
          black --check . || echo "Run 'black .' to format code"

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit and integration tests
        run: |
          cd starter-files/Python/part-04/league-mission-decoder
          pytest -v --tb=short

      - name: Generate coverage report
        run: |
          cd starter-files/Python/part-04/league-mission-decoder
          pytest --cov=decoder --cov=cli --cov-report=term-missing --cov-report=html --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./starter-files/Python/part-04/league-mission-decoder/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check coverage threshold (80%)
        run: |
          cd starter-files/Python/part-04/league-mission-decoder
          coverage report --fail-under=80 || echo "Coverage below 80%"

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: starter-files/Python/part-04/league-mission-decoder/htmlcov/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./starter-files/Python/part-04/league-mission-decoder/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          cd starter-files/Python/part-04/league-mission-decoder
          bandit -r . -f json -o bandit-report.json || echo "Security issues found - review report"
          cat bandit-report.json | jq '.' || true

      - name: Check dependencies with safety
        run: |
          cd starter-files/Python/part-04/league-mission-decoder
          # Note: Create requirements.txt first if needed
          safety check || echo "Dependency vulnerabilities found - review report"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: starter-files/Python/part-04/league-mission-decoder/bandit-report.json

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    if: always()
    steps:
      - name: Workflow status
        run: |
          echo "✅ Lint: ${{ needs.lint.result }}"
          echo "✅ Tests: ${{ needs.test.result }}"
          echo "✅ Security: ${{ needs.security-scan.result }}"
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            exit 1
          fi
